name: orientia_mobile
description: OrientIA — Application intelligente d'aide à l'orientation professionnelle.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.0.0

  # State management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # HTTP
  dio: ^5.4.0

  # Stockage local (offline-first)
  sqflite: ^2.3.3
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # UI
  fl_chart: ^0.69.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Firebase & Google Sign-In
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1

  # Utilitaires
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
