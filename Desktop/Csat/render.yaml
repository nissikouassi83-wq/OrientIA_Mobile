services:
  - type: web
    name: cnps-portail
    runtime: python
    plan: starter
    rootDir: Desktop/Csat
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/reclamations.sqlite3
    disk:
      name: cnps-reclamations
      mountPath: /var/data
      sizeGB: 1
