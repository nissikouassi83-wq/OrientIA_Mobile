<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17467e">
  <meta name="description" content="Vos droits, les démarches et les contacts CNPS en Côte d’Ivoire.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/cnps-192.png') }}">
  <title>{% block title %}La CNPS, votre partenaire pour la vie{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body>
  <main class="app">
    <div class="bar" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="offline-status" role="status" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <span data-connection-status>Portail sans compte · prêt pour le hors connexion</span>
      <button class="install-app" type="button" data-install-app hidden>Installer</button>
    </div>
    {% block content %}{% endblock %}
    <footer>
      <strong>La CNPS, votre partenaire pour la vie</strong>
      <p>Informations à caractère indicatif. Pour votre dossier, contactez la CNPS.</p>
    </footer>
  </main>
</body>
</html>
